{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <img class="product-image mx-auto d-block" src="{{ product.image.url }}" alt="{{ product.name }}">
            <h2 class="mt-3">{{ product.name }}</h2>
            <p class="lead">{{ product.description }}</p>
            <h4 class="mb-4">Price: £{{ product.display_price|floatformat:2 }}</h4>
            <a href="{% url 'add_to_basket' product.id %}" class="btn btn-success btn-lg">Buy now</a>
        </div>
    </div>
</div>

{% endblock %}
