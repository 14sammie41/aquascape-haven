{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}

<header class="bg-dark text-white text-center py-2">
    <h1 class="display-4">Aquascape Haven Community</h1>
    <p class="lead">Welcome to our hub of chatter for all things aquatic!</p>
</header>

<div class="container my-5">
    <div class="create-post-form mx-auto">
        <h3 class="text-center mb-4">{{ post|default_if_none:'Create a New Post' }}</h3>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100 mt-3">
                {% if post %} Save changes{% else %}Create post{% endif %}
            </button>
        </form>
    </div>
</div>

{% endblock %}
