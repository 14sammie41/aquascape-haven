{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}

<div class="container my-5">
    <div class="account-form mx-auto">
        <h2 class="text-center mb-4">Are you sure you would like to logout?</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100 mt-3">Log Out</button>
        </form>
    </div>
</div>

{% endblock %}
