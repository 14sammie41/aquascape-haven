{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}

<div class="container py-4">
    <div class="enter-form mx-auto">
        <h2 class="text-center mb-4">Enter to win!</h2>
        <form method="POST" enctype="multipart/form-data" action="{% url 'competition_enter' %}">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary">Submit Entry</button>
        </form>
    </div>
</div>

{% endblock %}
